<!doctype html><html><body><h1>Framework fixture</h1><form><label>Email<input type="email"></label><label>Password<input type="password"></label><button>Log in</button><p role="alert"></p></form><label>Search<input id="search"></label><ul><li>Apple</li><li>Orange</li></ul><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('[role=alert]').textContent='Invalid password';};document.querySelector('#search').oninput=e=>document.querySelectorAll('li').forEach(li=>li.hidden=!li.textContent.toLowerCase().includes(e.target.value.toLowerCase()));</script></body></html>
