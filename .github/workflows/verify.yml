name: WebPilot compatibility
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node dist/cli/index.js doctor --data-dir .webpilot/ci-data
      - run: npm ci --ignore-scripts --prefix tests/fixtures
      - run: node scripts/compatibility-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-node${{ matrix.node }}
          path: docs/compatibility-results.json
