name: WebPilot compatibility
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        # Playwright 1.60.0 has no dependency set or browser build for the
        # ubuntu-26.04 image that ubuntu-latest now resolves to, so ask for the
        # supported 24.04 image explicitly. (Name it ubuntu-latest again once
        # Playwright ships 26.04 support or the pin is no longer needed.)
        os: [macos-latest, ubuntu-24.04, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:version
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check:version -- --built
      - run: node dist/cli/index.js doctor --data-dir .webpilot/ci-data
      - run: npm ci --ignore-scripts --prefix tests/fixtures
      - run: node scripts/compatibility-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-node${{ matrix.node }}
          path: docs/compatibility-results.json
